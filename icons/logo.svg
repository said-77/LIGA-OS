<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1cc"/>
      <stop offset="50%" stop-color="#ffd175"/>
      <stop offset="100%" stop-color="#b8832a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Внешний щит -->
  <polygon points="50,4 88,18 88,60 50,96 12,60 12,18" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#goldGlow)" />
  <!-- Внутренняя кайма -->
  <polygon points="50,11 82,23 82,57 50,88 18,57 18,23" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <!-- Монограмма LIGA / Шестеренка и сантехнический ключ -->
  <circle cx="50" cy="46" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9"/>
  <path d="M50,22 L50,26 M50,66 L50,70 M26,46 L30,46 M70,46 L74,46 M33,29 L36,32 M64,60 L67,63 M67,29 L64,32 M33,63 L36,60" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Стилизованная буква L и M -->
  <path d="M43,36 L43,54 L57,54" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Звезда качества вверху -->
  <polygon points="50,14 52,18 56,18 53,21 54,25 50,22 46,25 47,21 44,18 48,18" fill="url(#goldGrad)"/>
  <!-- Надпись 16 BAR под щитом -->
  <text x="50" y="78" text-anchor="middle" fill="#ffd175" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="7" letter-spacing="1">16 BAR • LIGA</text>
</svg>
